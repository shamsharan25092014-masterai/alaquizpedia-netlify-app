<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Take a timed quiz on ALA QUIZPEDIA"/>
  <title>Quiz Player | ALA QUIZPEDIA</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <nav class="navbar scrolled" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">📚</span>
        <span class="logo-text">ALA<span class="accent">QUIZPEDIA</span></span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="quizzes.html" class="nav-link">← Back to Quizzes</a>
        <div class="nav-auth" id="navAuth">
          <a href="login.html" class="btn btn-ghost">Login</a>
        </div>
        <div class="nav-user hidden" id="navUser">
          <div class="user-menu" id="userMenuBtn">
            <div class="user-avatar" id="userAvatar">U</div>
            <span id="userDisplayName">User</span>
            <span class="chevron">▾</span>
          </div>
          <div class="user-dropdown hidden" id="userDropdown">
            <a href="admin.html" class="dropdown-item admin-only hidden" id="adminLink">⚙ Admin Panel</a>
            <a href="#" class="dropdown-item" id="logoutBtn">↩ Logout</a>
          </div>
        </div>
      </div>
      <button class="hamburger" id="hamburger">☰</button>
    </div>
  </nav>

  <!-- Loading state -->
  <div class="quiz-page" id="quizPage">
    <div id="loadingState" style="text-align:center;padding:4rem;">
      <div style="font-size:2rem;margin-bottom:1rem;">⏳</div>
      <p style="color:var(--text-muted);">Loading quiz...</p>
    </div>

    <!-- Quiz Start Screen -->
    <div id="startScreen" class="hidden">
      <div class="question-card" style="text-align:center;padding:3rem;">
        <div id="startImage" style="margin-bottom:1.5rem; display:none;"></div>
        <div id="startCategory" class="card-category cat-general" style="display:inline-block;margin-bottom:1rem;"></div>
        <h1 id="startTitle" style="font-family:'Outfit',sans-serif;font-size:2rem;font-weight:900;margin-bottom:0.75rem;"></h1>
        <p id="startDesc" style="color:var(--text-secondary);margin-bottom:2rem;"></p>
        <div style="display:flex;gap:2rem;justify-content:center;flex-wrap:wrap;margin-bottom:2rem;">
          <div style="text-align:center;">
            <div style="font-size:1.8rem;font-weight:800;font-family:'Outfit',sans-serif;color:var(--accent-blue);" id="startQCount">0</div>
            <div style="font-size:0.8rem;color:var(--text-muted);">Questions</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:1.8rem;font-weight:800;font-family:'Outfit',sans-serif;color:var(--accent-amber);" id="startTime">30s</div>
            <div style="font-size:0.8rem;color:var(--text-muted);">Per Question</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:1.8rem;font-weight:800;font-family:'Outfit',sans-serif;color:var(--accent-emerald);" id="startDiff">Mixed</div>
            <div style="font-size:0.8rem;color:var(--text-muted);">Difficulty</div>
          </div>
        </div>
        <button class="btn btn-primary btn-lg" onclick="startQuiz()">🚀 Start Quiz!</button>
      </div>
    </div>

    <!-- Quiz Play Screen -->
    <div id="playScreen" class="hidden">
      <div class="quiz-header">
        <div class="quiz-progress-wrap">
          <div class="quiz-progress-info">
            <span id="questionLabel">Question 1 of 10</span>
            <span id="scoreLabel">Score: 0</span>
          </div>
          <div class="progress-bar-outer">
            <div class="progress-bar-inner" id="progressBar" style="width:0%"></div>
          </div>
        </div>
        <div class="timer-wrap">
          <svg class="timer-svg" viewBox="0 0 64 64">
            <circle class="timer-bg" cx="32" cy="32" r="28"/>
            <circle class="timer-ring" id="timerRing" cx="32" cy="32" r="28"
              stroke="url(#timerGrad)"
              stroke-dasharray="176"
              stroke-dashoffset="0"/>
            <defs>
              <linearGradient id="timerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#6366f1"/>
                <stop offset="100%" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
          </svg>
          <div class="timer-text" id="timerText">30</div>
        </div>
      </div>

      <div class="question-card" id="questionCard">
        <div class="question-type-badge" id="questionType">Multiple Choice</div>
        <div class="question-text" id="questionText">Loading...</div>
        <div id="questionImageContainer" style="margin-bottom: 1.5rem; text-align: center; display: none;"></div>
        <div class="options-grid" id="optionsGrid"></div>
        <div id="explanationBox" class="explanation-box hidden"></div>
      </div>

      <div style="display:flex;justify-content:flex-end;">
        <button class="btn btn-primary hidden" id="nextBtn" onclick="nextQuestion()">Next →</button>
      </div>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="hidden">
      <div class="result-card">
        <div class="result-score-ring">
          <svg class="result-score-svg" viewBox="0 0 140 140">
            <circle class="score-bg" cx="70" cy="70" r="60"/>
            <circle class="score-fill" id="scoreFill" cx="70" cy="70" r="60"
              stroke="#6366f1"
              stroke-dasharray="377"
              stroke-dashoffset="377"/>
          </svg>
          <div>
            <div class="score-text-inner gradient-text" id="finalScorePct">0%</div>
          </div>
        </div>
        <div class="result-grade" id="resultGrade">🏆</div>
        <div class="result-title" id="resultTitle">Quiz Complete!</div>
        <div class="result-subtitle" id="resultSubtitle"></div>
        <div class="result-stats">
          <div class="result-stat">
            <div class="result-stat-num" id="resCorrect" style="color:var(--accent-emerald)">0</div>
            <div class="result-stat-label">Correct</div>
          </div>
          <div class="result-stat">
            <div class="result-stat-num" id="resWrong" style="color:var(--accent-rose)">0</div>
            <div class="result-stat-label">Wrong</div>
          </div>
          <div class="result-stat">
            <div class="result-stat-num" id="resTime" style="color:var(--accent-amber)">0s</div>
            <div class="result-stat-label">Time Taken</div>
          </div>
        </div>
        <div class="result-actions">
          <button class="btn btn-primary" onclick="retryQuiz()">🔄 Try Again</button>
          <a href="quizzes.html" class="btn btn-ghost">📚 More Quizzes</a>
          <a href="leaderboard.html" class="btn btn-ghost">🏅 Leaderboard</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const quizId = params.get('id');
    let quiz = null;
    let questions = [];
    let currentQ = 0;
    let score = 0;
    let timerInterval = null;
    let timeLeft = 30;
    let startTime = null;
    let totalTime = 0;
    let answered = false;

    // Load quiz
    if (!quizId) { window.location.href = 'quizzes.html'; }
    else {
      quiz = getQuizById(quizId);
      if (!quiz) { showToast('Quiz not found!', 'error'); setTimeout(()=>window.location.href='quizzes.html',1500); }
      else { showStartScreen(); }
    }

    function showStartScreen() {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('startScreen').classList.remove('hidden');
      const cat = quiz.category || 'General';
      document.getElementById('startCategory').textContent = cat;
      document.getElementById('startCategory').className = `card-category ${catClass(cat)}`;
      document.getElementById('startTitle').textContent = quiz.title;
      document.getElementById('startDesc').textContent = quiz.description || '';
      document.getElementById('startQCount').textContent = (quiz.questions||[]).length;
      document.getElementById('startTime').textContent = (quiz.timePerQuestion || 30) + 's';
      document.getElementById('startDiff').textContent = quiz.difficulty || 'Mixed';

      const imgContainer = document.getElementById('startImage');
      if (quiz.imageId) {
        const images = getImages();
        const imgObj = images.find(img => img.id === quiz.imageId);
        if (imgObj && imgObj.data) {
          imgContainer.innerHTML = `<img src="${imgObj.data}" alt="Quiz Cover" style="max-width:100%; height:auto; max-height:250px; border-radius:12px; object-fit:cover;"/>`;
          imgContainer.style.display = 'block';
        } else {
          imgContainer.style.display = 'none';
        }
      } else {
        imgContainer.style.display = 'none';
      }
    }

    function startQuiz() {
      questions = [...(quiz.questions || [])];
      if (questions.length === 0) { showToast('This quiz has no questions yet!', 'error'); return; }
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('playScreen').classList.remove('hidden');
      currentQ = 0; score = 0; startTime = Date.now();
      loadQuestion();
    }

    function loadQuestion() {
      if (currentQ >= questions.length) { endQuiz(); return; }
      answered = false;
      const q = questions[currentQ];
      const total = questions.length;

      document.getElementById('questionLabel').textContent = `Question ${currentQ+1} of ${total}`;
      document.getElementById('scoreLabel').textContent = `Score: ${score}`;
      document.getElementById('progressBar').style.width = `${(currentQ/total)*100}%`;
      document.getElementById('nextBtn').classList.add('hidden');
      document.getElementById('explanationBox').classList.add('hidden');
      document.getElementById('questionCard').style.animation = 'none';
      void document.getElementById('questionCard').offsetHeight;
      document.getElementById('questionCard').style.animation = 'fadeSlideIn 0.15s ease';

      const typeLabel = { mcq: 'Multiple Choice', truefalse: 'True / False', fillinblank: 'Fill in the Blank' };
      document.getElementById('questionType').textContent = typeLabel[q.type] || 'Multiple Choice';
      document.getElementById('questionText').textContent = q.questionText;

      const qImgContainer = document.getElementById('questionImageContainer');
      if (q.imageId) {
        const images = getImages();
        const imgObj = images.find(img => img.id === q.imageId);
        if (imgObj && imgObj.data) {
          qImgContainer.innerHTML = `<img src="${imgObj.data}" alt="Question Image" style="max-width:100%; height:auto; max-height:300px; border-radius:8px;"/>`;
          qImgContainer.style.display = 'block';
        } else {
          qImgContainer.style.display = 'none';
        }
      } else {
        qImgContainer.style.display = 'none';
      }

      const grid = document.getElementById('optionsGrid');
      if (q.type === 'fillinblank') {
        grid.innerHTML = `
          <div class="fill-input-wrap">
            <input type="text" class="form-input" id="fillAnswer" placeholder="Type your answer..." autocomplete="off"/>
            <button class="btn btn-primary" onclick="checkFill()">Submit</button>
          </div>
        `;
        document.getElementById('fillAnswer').addEventListener('keydown', e => { if(e.key==='Enter') checkFill(); });
      } else {
        const letters = ['A','B','C','D'];
        const opts = q.type === 'truefalse' ? ['True','False'] : (q.options || []);
        grid.innerHTML = opts.map((opt,i) => `
          <button class="option-btn" onclick="checkAnswer(this,'${escOpt(opt)}','${escOpt(q.correctAnswer)}','${escOpt(q.explanation||'')}')">
            <span class="option-letter">${letters[i]||i+1}</span>
            <span>${opt}</span>
          </button>
        `).join('');
      }

      startTimer(quiz.timePerQuestion || 30, q);
    }

    function escOpt(s){ return (s+'').replace(/'/g,"\\'"); }

    function startTimer(seconds, q) {
      clearInterval(timerInterval);
      timeLeft = seconds;
      const ring = document.getElementById('timerRing');
      const circumference = 176;
      updateTimer(timeLeft, seconds, ring, circumference);

      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimer(timeLeft, seconds, ring, circumference);
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          if (!answered) {
            timeoutQuestion(q);
          }
        }
      }, 1000);
    }

    function updateTimer(left, total, ring, circ) {
      const offset = circ - (left/total)*circ;
      ring.style.strokeDashoffset = offset;
      document.getElementById('timerText').textContent = left;
      const pct = left/total;
      ring.style.stroke = pct > 0.5 ? '#6366f1' : pct > 0.25 ? '#f59e0b' : '#f43f5e';
    }

    function timeoutQuestion(q) {
      answered = true;
      // Disable all buttons
      document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
      const fillBtn = document.querySelector('.fill-input-wrap button');
      if(fillBtn) fillBtn.disabled = true;
      showExplanation(false, q.correctAnswer, q.explanation);
      document.getElementById('nextBtn').classList.remove('hidden');
      showToast("⏰ Time's up!", 'error', 2000);
    }

    function checkAnswer(btn, selected, correct, explanation) {
      if (answered) return;
      answered = true;
      clearInterval(timerInterval);
      document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

      const isCorrect = selected.trim().toLowerCase() === correct.trim().toLowerCase();
      btn.classList.add(isCorrect ? 'correct' : 'incorrect');

      // Highlight correct answer
      if (!isCorrect) {
        document.querySelectorAll('.option-btn').forEach(b => {
          if (b.querySelector('span:last-child') && b.querySelector('span:last-child').textContent.trim().toLowerCase() === correct.trim().toLowerCase()) {
            b.classList.add('correct');
          }
        });
      }

      if (isCorrect) { 
        score++; 
        showToast('✅ Correct!', 'success', 1000); 
        setTimeout(nextQuestion, 1000); // Auto advance
      }
      else { 
        showToast('❌ Wrong!', 'error', 1500); 
        document.getElementById('nextBtn').classList.remove('hidden');
      }

      showExplanation(isCorrect, correct, explanation);
    }

    function checkFill() {
      if (answered) return;
      const input = document.getElementById('fillAnswer');
      const q = questions[currentQ];
      const userAns = (input.value||'').trim().toLowerCase();
      const correct = (q.correctAnswer||'').trim().toLowerCase();
      answered = true;
      clearInterval(timerInterval);
      input.disabled = true;
      document.querySelector('.fill-input-wrap button').disabled = true;

      const isCorrect = userAns === correct;
      input.style.borderColor = isCorrect ? 'rgba(16,185,129,0.5)' : 'rgba(244,63,94,0.5)';
      input.style.background = isCorrect ? 'rgba(16,185,129,0.08)' : 'rgba(244,63,94,0.08)';

      if (isCorrect) { 
        score++; 
        showToast('✅ Correct!', 'success', 1000); 
        setTimeout(nextQuestion, 1000); // Auto advance
      }
      else { 
        showToast(`❌ Answer: ${q.correctAnswer}`, 'error', 2500); 
        document.getElementById('nextBtn').classList.remove('hidden');
      }

      showExplanation(isCorrect, q.correctAnswer, q.explanation);
    }

    function showExplanation(correct, answer, explanation) {
      const box = document.getElementById('explanationBox');
      box.classList.remove('hidden');
      box.innerHTML = `<strong>${correct ? '✅ Correct!' : '❌ Incorrect'}</strong> — Answer: <strong>${answer}</strong>${explanation ? '<br/><span style="color:var(--text-muted);font-size:0.85rem;">' + explanation + '</span>' : ''}`;
    }

    function nextQuestion() {
      currentQ++;
      loadQuestion();
    }

    function endQuiz() {
      clearInterval(timerInterval);
      totalTime = Math.round((Date.now() - startTime) / 1000);
      const user = getCurrentUser();

      let xpEarned = 0;
      // Save score
      if (user) {
        const res = submitScore({
          id: genId('sc'),
          userId: user.id,
          username: user.username,
          displayName: user.displayName || user.username,
          quizId: quiz.id,
          quizTitle: quiz.title,
          score,
          totalQuestions: questions.length,
          timeTaken: totalTime,
          completedAt: new Date().toISOString()
        });
        xpEarned = res ? res.xpGained : calculateXPForScore({ score, totalQuestions: questions.length, timeTaken: totalTime });
      }

      // Show result
      document.getElementById('playScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.remove('hidden');

      const pct = Math.round((score / questions.length) * 100);
      document.getElementById('finalScorePct').textContent = pct + '%';
      document.getElementById('resCorrect').textContent = score;
      document.getElementById('resWrong').textContent = questions.length - score;
      document.getElementById('resTime').textContent = totalTime + 's';

      // Inject XP earned badge if logged in
      if (user && xpEarned > 0) {
        const resStats = document.querySelector('.result-stats');
        let xpStat = document.getElementById('resXPStat');
        if (!xpStat && resStats) {
          xpStat = document.createElement('div');
          xpStat.id = 'resXPStat';
          xpStat.className = 'result-stat';
          const perfectBonus = (score === questions.length && score > 0) ? ' (+5 Bonus!)' : '';
          // Build badge icons HTML (limit 50)
          const badgeIcons = (window.currentAchievements || []).slice(0,50)
            .map(b => `<span style="font-size:1.2rem;margin-left:4px;">${b.icon}</span>`).join('');
          xpStat.innerHTML = `
            <div class="result-stat-num" style="color:var(--accent_amber);font-size:1.6rem;" id="resXPNum">+${xpEarned} XP</div>
            <div class="result-stat-label">Earned${perfectBonus}</div>
            <div class="badge-icons" style="margin-top:0.4rem;">${badgeIcons}</div>
          `;
          resStats.appendChild(xpStat);
        }
      }

      // Animate ring
      setTimeout(() => {
        const fill = document.getElementById('scoreFill');
        const circ = 377;
        fill.style.strokeDashoffset = circ - (pct/100)*circ;
        fill.style.stroke = pct >= 80 ? '#10b981' : pct >= 50 ? '#6366f1' : '#f43f5e';
      }, 100);

      // Grade
      let grade, title, subtitle;
      if (pct >= 90) { grade = '🥇 A+'; title = 'Outstanding!'; subtitle = 'You are a GK champion!'; }
      else if (pct >= 75) { grade = '🥈 A'; title = 'Excellent!'; subtitle = 'Great knowledge!'; }
      else if (pct >= 60) { grade = '🥉 B'; title = 'Good Job!'; subtitle = 'Keep practicing!'; }
      else if (pct >= 40) { grade = '📘 C'; title = 'Fair Attempt'; subtitle = 'Room to improve!'; }
      else { grade = '📖 D'; title = 'Keep Learning'; subtitle = 'Practice makes perfect!'; }

      document.getElementById('resultGrade').textContent = grade;
      document.getElementById('resultTitle').textContent = title;
      document.getElementById('resultSubtitle').textContent = `${score}/${questions.length} correct in ${totalTime}s — ${subtitle}`;
    }

    function retryQuiz() {
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('startScreen').classList.remove('hidden');
    }
  </script>
</body>
</html>
