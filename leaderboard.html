<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Leaderboard — ALA QUIZPEDIA by A.SHAM SHARAN"/>
  <title>Leaderboard | ALA QUIZPEDIA</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <nav class="navbar scrolled" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">📚</span>
        <span class="logo-text">ALA<span class="accent">QUIZPEDIA</span></span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">Home</a>
        <a href="quizzes.html" class="nav-link">Quizzes</a>
        <a href="leaderboard.html" class="nav-link active">Leaderboard</a>
        <div class="nav-auth" id="navAuth">
          <a href="login.html" class="btn btn-ghost">Login</a>
          <a href="login.html#register" class="btn btn-primary">Sign Up</a>
        </div>
        <div class="nav-user hidden" id="navUser">
          <div class="user-menu" id="userMenuBtn">
            <div class="user-avatar" id="userAvatar">U</div>
            <span id="userDisplayName">User</span>
            <span class="chevron">▾</span>
          </div>
          <div class="user-dropdown hidden" id="userDropdown">
            <a href="admin.html" class="dropdown-item admin-only hidden" id="adminLink">⚙ Admin Panel</a>
            <a href="#" class="dropdown-item" id="logoutBtn">↩ Logout</a>
          </div>
        </div>
      </div>
      <button class="hamburger" id="hamburger">☰</button>
    </div>
  </nav>

  <div class="lb-page">
    <div class="page-header">
      <h1 class="page-title">🏆 <span class="gradient-text">Leaderboard</span></h1>
      <p class="page-sub">Top performers on ALA QUIZPEDIA</p>
    </div>

    <!-- Top 3 Podium -->
    <div id="podium" style="display:flex;justify-content:center;align-items:flex-end;gap:1rem;margin-bottom:3rem;flex-wrap:wrap;"></div>

    <!-- Full Rankings Table -->
    <div class="table-card">
      <div class="table-header">
        <span class="table-title">📊 Full Rankings</span>
        <select class="form-select" id="quizFilter" style="width:auto;padding:0.4rem 0.8rem;font-size:0.85rem;">
          <option value="all">All Quizzes</option>
        </select>
      </div>
      <div style="overflow-x:auto;">
        <table class="lb-table" id="lbTable">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Player</th>
              <th>Quiz</th>
              <th>Score</th>
              <th>Time</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="lbBody">
            <tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:3rem;">No scores yet. Take a quiz to appear here!</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2024 ALA QUIZPEDIA by A.SHAM SHARAN. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    const db = getDB();
    const scores = db.scores || [];
    const quizzes = db.quizzes || [];
    const currentUser = getCurrentUser();

    // Populate quiz filter
    const filterEl = document.getElementById('quizFilter');
    quizzes.forEach(q => {
      filterEl.innerHTML += `<option value="${q.id}">${q.title}</option>`;
    });

    function renderLeaderboard(filterQuizId = 'all') {
      let filtered = scores;
      if (filterQuizId !== 'all') filtered = scores.filter(s => s.quizId === filterQuizId);

      // Sort by percentage desc, then time asc
      const sorted = [...filtered].sort((a,b) => {
        const pa = a.score/a.totalQuestions, pb = b.score/b.totalQuestions;
        if (pb !== pa) return pb - pa;
        return a.timeTaken - b.timeTaken;
      });

      // Podium (top 3)
      const podium = document.getElementById('podium');
      const top3 = sorted.slice(0,3);
      const podiumOrder = [1,0,2]; // silver, gold, bronze
      const heights = [80, 110, 60];
      const medals = ['🥈','🥇','🥉'];
      const colors = ['#94a3b8','#fbbf24','#b45309'];

      if (top3.length === 0) {
        podium.innerHTML = '';
      } else {
        podium.innerHTML = podiumOrder.map(i => {
          const s = top3[i];
          if (!s) return '';
          const pct = Math.round((s.score/s.totalQuestions)*100);
          return `
            <div style="text-align:center;animation:fadeSlideIn 0.5s ${i*0.15}s ease both;">
              <div style="font-size:2rem;">${medals[i]}</div>
              <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,${colors[i]},${colors[i]}88);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;margin:0.5rem auto;">${(s.displayName||s.username||'?')[0].toUpperCase()}</div>
              <div style="font-weight:700;font-size:0.9rem;margin-bottom:0.25rem;">${s.displayName||s.username}</div>
              <div style="font-size:0.8rem;color:var(--text-muted);">${pct}%</div>
              <div style="width:80px;height:${heights[i]}px;background:linear-gradient(to top,${colors[i]}33,${colors[i]}11);border:1px solid ${colors[i]}44;border-radius:8px 8px 0 0;margin-top:0.5rem;"></div>
            </div>
          `;
        }).join('');
      }

      // Table
      const tbody = document.getElementById('lbBody');
      if (sorted.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:3rem;">No scores yet. Take a quiz to appear here!</td></tr>';
        return;
      }

      tbody.innerHTML = sorted.map((s,i) => {
        const pct = Math.round((s.score/s.totalQuestions)*100);
        const rankClass = i===0?'rank-gold':i===1?'rank-silver':i===2?'rank-bronze':'';
        const rankIcon = i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`;
        const isMe = currentUser && s.userId === currentUser.id;
        return `
          <tr class="lb-row" style="${isMe?'background:rgba(99,102,241,0.06);':''}">
            <td><span class="lb-rank ${rankClass}">${rankIcon}</span></td>
            <td>
              <div class="lb-user">
                <div class="lb-avatar">${(s.displayName||s.username||'?')[0].toUpperCase()}</div>
                <div>
                  <div style="font-weight:600;">${s.displayName||s.username} ${isMe?'<span class="badge badge-blue" style="font-size:0.7rem;">You</span>':''}</div>
                  <div style="font-size:0.75rem;color:var(--text-muted);">${s.username}</div>
                </div>
              </div>
            </td>
            <td style="color:var(--text-secondary);font-size:0.88rem;">${s.quizTitle||'Unknown Quiz'}</td>
            <td>
              <span class="lb-score">${s.score}/${s.totalQuestions}</span>
              <span style="margin-left:0.5rem;font-size:0.8rem;color:${pct>=80?'var(--accent-emerald)':pct>=50?'var(--accent-blue)':'var(--accent-rose)'};">(${pct}%)</span>
            </td>
            <td style="color:var(--text-muted);font-size:0.88rem;">${s.timeTaken}s</td>
            <td style="color:var(--text-muted);font-size:0.82rem;">${formatDate(s.completedAt)}</td>
          </tr>
        `;
      }).join('');
    }

    filterEl.addEventListener('change', e => renderLeaderboard(e.target.value));
    renderLeaderboard();
  </script>
</body>
</html>
